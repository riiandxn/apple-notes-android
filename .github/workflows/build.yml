name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Image ubuntu-24.04 sudah berisi Android SDK (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AppleNotes-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish ke Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AppleNotes.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AppleNotes.apk \
            --title "Apple Notes untuk Android" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. Unduh AppleNotes.apk lalu install di HP Android." \
            --target "$GITHUB_SHA"
